apiVersion: apps/v1
kind: Deployment
metadata:
  name: microsvc-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: microsvc
  template:
    metadata:
      labels:
        app: microsvc
    spec:
      containers:
        - name: microsvc-container
          image: paulbouwer/hello-kubernetes:1.11
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
